# Codzienne odświeżenie cennika z raportu magazynowego Comarch ERP Optima.
#
# Wszystko w jednym przebiegu — pobranie poczty, przeliczenie, commit, budowa
# i publikacja. Osobny workflow publikujący nie zadziałałby: commit zrobiony
# tokenem GitHuba celowo nie uruchamia innych workflow, więc strona zostałaby
# na starych danych bez żadnego błędu.
#
# Wymagane sekrety (Settings → Secrets and variables → Actions):
#   POCZTA_SERWER · POCZTA_LOGIN · POCZTA_HASLO
name: Cennik z magazynu

on:
  schedule:
    # Raport z Optimy przychodzi w dni powszechne o 1:15, więc nad ranem czeka
    # od dawna. GitHub liczy harmonogram w UTC i nie zna czasu letniego, stąd
    # przy każdym terminie dwie godziny. Najwcześniejsza z nich to 3:37 zimą —
    # wciąż ponad dwie godziny po 1:15, więc zmiana czasu niczego nie psuje.
    # Poniedziałek–piątek, bo w weekend raport nie przychodzi.
    #
    # Nierówna minuta jest celowa. Pierwszy termin (5:00, czyli 03:00 UTC) nie
    # odpalił się ani razu: o pełnej godzinie startują harmonogramy z całego
    # świata, a GitHub takie przebiegi opóźnia albo pomija — nie gwarantuje ich.
    #
    # Dwa terminy, bo 7 września nie odpalił się żaden. Jeśli GitHub pominie
    # pierwszy, zostaje drugi. Podwójny przebieg jest nieszkodliwy: krok „zmiana"
    # porówna plik i przy identycznej treści zatrzyma się przed publikacją.
    - cron: '37 2 * * 1-5'   # 4:37 latem, 3:37 zimą
    - cron: '23 3 * * 1-5'   # 5:23 latem, 4:23 zimą — termin zapasowy
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cennik:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: pip install --quiet openpyxl

      - name: Pobierz raport ze skrzynki
        env:
          POCZTA_SERWER: ${{ secrets.POCZTA_SERWER }}
          POCZTA_LOGIN: ${{ secrets.POCZTA_LOGIN }}
          POCZTA_HASLO: ${{ secrets.POCZTA_HASLO }}
        run: python3 narzedzia/cennik/pobierz.py raport.xlsx

      # generuj.py sam przerywa, gdy raport jest okrojony albo starszy niż cennik
      - name: Przelicz cennik
        run: python3 narzedzia/cennik/generuj.py raport.xlsx

      - id: zmiana
        run: |
          rm -f raport.xlsx
          if git diff --quiet -- app/src/data/price-data.js; then
            echo "jest=nie" >> "$GITHUB_OUTPUT"
            echo "Cennik bez zmian — nie publikuję."
          else
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz w repozytorium
        if: steps.zmiana.outputs.jest == 'tak'
        run: |
          git config user.name  "Automat cennika DKM"
          git config user.email "raporty@d-k-m.eu"
          git add app/src/data/price-data.js
          git commit -m "Cennik: $(sed -n "s/.*updated: 'stan na \(.*\)',/\1/p" app/src/data/price-data.js)"
          for p in 1 2 3 4; do git push && break || sleep $((2**p)); done

      - name: Zbuduj aplikację
        if: steps.zmiana.outputs.jest == 'tak'
        working-directory: app
        run: |
          npm ci
          npm run build:dkm

      - uses: actions/upload-pages-artifact@v5
        if: steps.zmiana.outputs.jest == 'tak'
        with:
          path: app/dist

      - id: publikacja
        if: steps.zmiana.outputs.jest == 'tak'
        uses: actions/deploy-pages@v5
