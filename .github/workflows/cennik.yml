# Codzienne odświeżenie cennika z raportu magazynowego Comarch ERP Optima.
#
# Wszystko w jednym przebiegu — pobranie poczty, przeliczenie, commit, budowa
# i publikacja. Osobny workflow publikujący nie zadziałałby: commit zrobiony
# tokenem GitHuba celowo nie uruchamia innych workflow, więc strona zostałaby
# na starych danych bez żadnego błędu.
#
# Wymagane sekrety (Settings → Secrets and variables → Actions):
#   POCZTA_SERWER · POCZTA_LOGIN · POCZTA_HASLO
name: Cennik z magazynu

on:
  schedule:
    # Raport z Optimy przychodzi w dni powszechne o 1:15, więc nad ranem czeka
    # od dawna. GitHub liczy harmonogram w UTC i nie zna czasu letniego, stąd
    # przy każdym terminie dwie godziny. Najwcześniejsza z nich to 3:37 zimą —
    # wciąż ponad dwie godziny po 1:15, więc zmiana czasu niczego nie psuje.
    # Poniedziałek–piątek, bo w weekend raport nie przychodzi.
    #
    # Nierówna minuta jest celowa. Pierwszy termin (5:00, czyli 03:00 UTC) nie
    # odpalił się ani razu: o pełnej godzinie startują harmonogramy z całego
    # świata, a GitHub takie przebiegi opóźnia albo pomija — nie gwarantuje ich.
    #
    # Dwa terminy, bo 7 września nie odpalił się żaden. Jeśli GitHub pominie
    # pierwszy, zostaje drugi. Podwójny przebieg jest nieszkodliwy: krok „zmiana"
    # porówna plik i przy identycznej treści zatrzyma się przed publikacją.
    - cron: '37 2 * * 1-5'   # 4:37 latem, 3:37 zimą
    - cron: '23 3 * * 1-5'   # 5:23 latem, 4:23 zimą — termin zapasowy
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Pobranie raportu, przeliczenie cennika, commit i zbudowanie paczki.
  #
  # To zadanie celowo NIE deklaruje `environment`. Do 24.11.2026 środowisko
  # `github-pages` stało na całym zadaniu, więc blokada wdrożenia zatrzymywała
  # je PRZED pierwszym krokiem: w październiku przez cztery dni nie pobierał się
  # nawet raport z Optimy, choć z publikacją nie miało to nic wspólnego — cennik
  # zamarł na starych danych, a przyczyna leżała w zupełnie innym miejscu.
  # Teraz blokada wdrożenia może wstrzymać najwyżej samą publikację; cennik
  # przeliczy się i trafi do repozytorium niezależnie od niej.
  cennik:
    runs-on: ubuntu-latest
    outputs:
      # data w postaci RRRR-MM-DD dla zadania publikującego — ono nie ma w swoim
      # checkoucie commitu zrobionego przed chwilą tutaj, więc z pliku odczytałoby
      # datę wczorajszą i sprawdzałoby nie to, co trzeba
      data: ${{ steps.zmiana.outputs.data }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: pip install --quiet openpyxl

      - name: Pobierz raport ze skrzynki
        env:
          POCZTA_SERWER: ${{ secrets.POCZTA_SERWER }}
          POCZTA_LOGIN: ${{ secrets.POCZTA_LOGIN }}
          POCZTA_HASLO: ${{ secrets.POCZTA_HASLO }}
        run: python3 narzedzia/cennik/pobierz.py raport.xlsx

      # generuj.py sam przerywa, gdy raport jest okrojony albo starszy niż cennik
      - name: Przelicz cennik
        run: python3 narzedzia/cennik/generuj.py raport.xlsx

      # Warunek pilnuje już TYLKO commitu — pustych commitów nie robimy.
      # Publikacja niżej jest bezwarunkowa; dlaczego, mówi komentarz przy niej.
      - id: zmiana
        run: |
          rm -f raport.xlsx
          echo "data=$(python3 narzedzia/cennik/sprawdz-publikacje.py --data)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- app/src/data/price-data.js; then
            echo "jest=nie" >> "$GITHUB_OUTPUT"
            echo "Cennik bez zmian — nowego commitu nie będzie, ale publikuję stan repozytorium."
          else
            echo "jest=tak" >> "$GITHUB_OUTPUT"
          fi

      - name: Zapisz w repozytorium
        if: steps.zmiana.outputs.jest == 'tak'
        run: |
          git config user.name  "Automat cennika DKM"
          git config user.email "raporty@d-k-m.eu"
          git add app/src/data/price-data.js
          git commit -m "Cennik: $(sed -n "s/.*updated: 'stan na \(.*\)',/\1/p" app/src/data/price-data.js)"
          for p in 1 2 3 4; do git push && break || sleep $((2**p)); done

      # Budowa i publikacja idą ZAWSZE, także gdy cennik się nie zmienił.
      #
      # 24 listopada 2026 `deploy-pages` padł na usterce GitHuba, a cennik był już
      # zapisany w repozytorium. Oba ręczne ponowienia zastały identyczny plik,
      # więc warunek „plik się zmienił" pomijał im publikację — i kończyły się
      # na zielono, nie publikując nic. Ratunek, który zaleca sam GitHub
      # („re-run the deployment at a later time"), był przez ten warunek
      # niewykonalny, a dane z tamtego dnia nie dotarły do klientów wcale.
      #
      # Bezwarunkowa publikacja kosztuje `npm ci` i wgranie tej samej treści
      # dwa razy dziennie, a daje to, że nieudana publikacja naprawia się sama
      # przy najbliższym z pozostałych przebiegów tego samego dnia.
      - name: Zbuduj aplikację
        working-directory: app
        run: |
          npm ci
          npm run build:dkm

      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  # Publikacja — jedyne zadanie ze środowiskiem `github-pages`, czyli jedyne,
  # które blokada wdrożenia potrafi zatrzymać. `deploy-pages` odnajduje paczkę
  # wgraną przez zadanie wyżej w tym samym przebiegu; to jest zwykły układ,
  # jaki GitHub zaleca dla Pages.
  publikacja:
    needs: cennik
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: publikacja
        uses: actions/deploy-pages@v5

      # Dopiero to orzeka, że przebieg się udał. Ani zielony krok publikacji, ani
      # wpis wdrożenia w API tego nie dowodzą: wpis powstaje przy starcie zadania
      # i zamyka się razem z nim, także wtedy, gdy publikacja została pominięta.
      # Jedynym dowodem jest data, która naprawdę leży pod adresem strony.
      #
      # Data przychodzi z zadania liczącego cennik, a nie z checkoutu: tutejszy
      # checkout nie zawiera commitu zrobionego przed chwilą w tamtym zadaniu.
      - name: Sprawdź, że strona naprawdę ma te dane
        env:
          SPRAWDZ_OCZEKIWANA: ${{ needs.cennik.outputs.data }}
        run: python3 narzedzia/cennik/sprawdz-publikacje.py
