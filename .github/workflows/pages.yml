# Budowanie i publikacja aplikacji na GitHub Pages.
#
# Efekt: https://<konto>.github.io/dobor/
# W ustawieniach repozytorium: Settings → Pages → Source: „GitHub Actions”.
#
# Katalog dist/ nie jest trzymany w repozytorium (jest w .gitignore) — powstaje tu,
# przy każdym wdrożeniu, z aktualnego kodu. Dzięki temu na Pages nie może wylądować
# stara wersja cennika.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jedno wdrożenie naraz; w toku nie przerywamy, żeby nie zostawić Pages w połowie
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # build:dkm wpisuje w aplikację listę dozwolonych adresów — pod innym
      # adresem pokaże komunikat o nieautoryzowanej kopii
      - run: npm run build:dkm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
