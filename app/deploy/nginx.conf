# DKM · Dobór przekładni — fragment konfiguracji nginx dla podstrony dkmpower.pl/dobor/
#
# Wklej do bloku `server` obsługującego dkmpower.pl. Zawartość katalogu `dist/`
# wgraj do /var/www/dkm/dobor/.
#
# Polityka bezpieczeństwa treści (CSP) jest dopasowana do tego, czego aplikacja
# faktycznie potrzebuje: skrypty tylko własne i gtag.js, wysyłka zamówień tylko
# na formspree.io, czcionki wyłącznie lokalne. Style muszą mieć 'unsafe-inline',
# bo cały układ opiera się na stylach wpisanych w elementy — tak samo jak w
# prototypie. Nic poza tą listą przeglądarka zablokuje.

location = /dobor {
    return 301 /dobor/;
}

location /dobor/ {
    alias /var/www/dkm/dobor/;
    index index.html;
    try_files $uri $uri/ /dobor/index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self' https://dkmpower.pl https://www.dkmpower.pl; form-action 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://formspree.io https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Service worker musi być sprawdzany przy każdym wejściu — inaczej klient
    # zostanie ze starym cennikiem po wdrożeniu nowej wersji.
    location = /dobor/sw.js {
        alias /var/www/dkm/dobor/sw.js;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self'" always;
    }
    location = /dobor/index.html {
        alias /var/www/dkm/dobor/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Pliki z sumą kontrolną w nazwie (build/app-XXXX.js) nigdy się nie zmieniają
    location ~* ^/dobor/(build|fonts|assets)/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
